name: desktop

on:
  workflow_dispatch:
    inputs:
      nur_lock:
        description: "nur Cargo.lock erzeugen"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  lock:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nur_lock }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile && bash lock-pins.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 30
          if-no-files-found: error

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.nur_lock) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-deb
            bundles: deb
            glob: src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-24.04
            name: linux-appimage
            bundles: appimage
            glob: src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-2025
            name: windows-nsis
            bundles: nsis
            glob: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev build-essential
      - name: Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: npm ci --ignore-scripts
      - name: AppImage tools (pinned, SHA-256 verified; security gate B1, no cache)
        if: matrix.name == 'linux-appimage'
        run: |
          d="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$d"
          curl -fsSL --proto '=https' -o "$d/AppRun-x86_64" https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          curl -fsSL --proto '=https' -o "$d/linuxdeploy-07333c6-x86_64.AppImage" https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          curl -fsSL --proto '=https' -o "$d/linuxdeploy-plugin-appimage.AppImage" https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          (cd "$d" && sha256sum -c "$GITHUB_WORKSPACE/src-tauri/appimage-tools.sha256")
          chmod 0755 "$d/AppRun-x86_64" "$d/linuxdeploy-07333c6-x86_64.AppImage" "$d/linuxdeploy-plugin-appimage.AppImage"
      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: AppImage tools unchanged after build (security gate B2)
        if: matrix.name == 'linux-appimage'
        run: |
          d="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          (cd "$d" && sha256sum -c "$GITHUB_WORKSPACE/src-tauri/appimage-tools-after.sha256")
          extra=$(ls -A "$d" | grep -vxE 'AppRun-x86_64|linuxdeploy-07333c6-x86_64\.AppImage|linuxdeploy-plugin-appimage\.AppImage|linuxdeploy-plugin-gtk\.sh|linuxdeploy-plugin-gstreamer\.sh' || true)
          if [ -n "$extra" ]; then echo "unexpected files in $d: $extra"; exit 1; fi
          sha256sum src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schachtrainer-${{ matrix.name }}
          path: ${{ matrix.glob }}
          retention-days: 30
          if-no-files-found: error
